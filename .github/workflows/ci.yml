name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Format
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi
      - name: Compile WebAssembly
        run: GOOS=js GOARCH=wasm go build -o qr2.wasm ./cmd/engine

  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install decoder
        run: python -m pip install --disable-pip-version-check zxing-cpp==3.1.1 pillow==12.2.0
      - name: Generate corpus
        run: go run ./cmd/corpus -out testdata/corpus
      - name: Decode corpus
        run: python tools/decode_corpus.py testdata/corpus
